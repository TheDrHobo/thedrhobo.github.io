---
layout: page
title: Board Games
description: "Every board games post on The Ranking Hobo, including my top 10 board games of all time."
---
{% for post in site.categories.boardgames %}
  <a href="{{ site.github.url }}{{ post.url }}">
    <div class="featured-posts" {% if post.image %}style="background-image:url({{ post.image | relative_url }})"{% endif %}>
      <h2><span>{{ post.title }}</span></h2>
    </div>
  </a>
{% endfor %}
