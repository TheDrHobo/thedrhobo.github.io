---
layout: page
title: Books
description: "Every books post on The Ranking Hobo, including my top 10 books of all time and my top 5 graphic novels."
---
{% for post in site.categories.books %}
  <a href="{{ site.github.url }}{{ post.url }}">
    <div class="featured-posts" {% if post.image %}style="background-image:url({{ post.image | relative_url }})"{% endif %}>
      <h2><span>{{ post.title }}</span></h2>
    </div>
  </a>
{% endfor %}
